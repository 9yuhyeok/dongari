<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>연세대학교 교내/연합 동아리·학회 모아보기</title>
  <style>
    :root{--ink:#182018;--muted:#69736b;--line:#dde4dd;--paper:#f4f6f1;--card:#fff;--green:#176b43;--green2:#dff1e7;--orange:#a84d1c;--orange2:#fff0e7;--blue:#2b5cab;--shadow:0 14px 36px rgba(27,49,34,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
    button,input{font:inherit}a{color:inherit}.wrap{width:min(1440px,calc(100% - 40px));margin:auto}.hero{padding:54px 0 30px;background:linear-gradient(130deg,#edf6e9,#f9f4e8 56%,#eef4f8);border-bottom:1px solid var(--line)}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--green);text-transform:uppercase}.hero h1{font-size:clamp(29px,4vw,54px);line-height:1.08;letter-spacing:-.045em;margin:12px 0 0;max-width:920px}
    .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;padding:26px 0 56px;align-items:start}.filters{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.filter-head{padding:20px;display:flex;align-items:center;justify-content:space-between}.filter-head h2{margin:0;font-size:18px}.reset{border:0;background:none;color:var(--green);font-size:13px;font-weight:800;cursor:pointer}.group{padding:18px 20px;border-bottom:1px solid #edf0ed}.group:last-child{border:0}.group h3{font-size:13px;margin:0 0 11px;color:#4f5b52;letter-spacing:.02em}.group-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.topic-toggle{border:0;background:none;padding:0 0 10px;color:var(--green);font-size:12px;font-weight:800;cursor:pointer}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{position:relative}.check input{position:absolute;opacity:0;pointer-events:none}.check span{display:block;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;background:#fff;cursor:pointer;transition:.15s}.check input:checked+span{border-color:var(--green);background:var(--green2);color:#0c5834;font-weight:750}.switches{display:grid;gap:9px}.switch{display:flex;align-items:center;justify-content:space-between;font-size:13px}.switch input{width:38px;height:22px;accent-color:var(--green)}
    .content{min-width:0}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.search{flex:1;position:relative}.search input{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 16px 0 44px;outline:none;box-shadow:0 6px 20px rgba(27,49,34,.04)}.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,107,67,.12)}.search:before{content:"⌕";position:absolute;left:16px;top:8px;font-size:25px;color:#657067}.result-count{white-space:nowrap;font-size:14px;color:var(--muted)}
    .time-panel{margin:0}.day-select{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.day-slot{border:1px solid var(--line);border-radius:9px;background:#fff;color:#5e695f;padding:8px 0;font-size:12px;font-weight:750;cursor:pointer}.day-slot.on{border-color:var(--green);background:var(--green2);color:#0d5934}.tiny{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;min-height:236px;box-shadow:0 8px 22px rgba(27,49,34,.045)}.card:hover{border-color:#c7d4c9;transform:translateY(-1px);transition:.15s}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{font-size:11px;font-weight:750;border-radius:999px;padding:4px 8px;background:#eef2ee;color:#536057}.chip.type{background:var(--green2);color:#0d5934}.chip.scope{background:#eaf0fb;color:#31598f}.card-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}.card h2{flex:1;min-width:0;font-size:19px;line-height:1.32;letter-spacing:-.02em;margin:0;word-break:keep-all}.title-source{flex:none;font-size:12px;font-weight:800;color:var(--green);text-decoration:none;white-space:nowrap}.title-source:hover{text-decoration:underline}.facts{display:grid;gap:9px;margin-bottom:15px}.fact{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:13px}.fact dt{color:var(--muted)}.fact dd{margin:0;word-break:keep-all}.deadline{font-weight:800;color:var(--green)}.empty{display:none;text-align:center;padding:60px 20px;background:#fff;border:1px dashed #cbd5cd;border-radius:18px;color:var(--muted)}.footer-credit{text-align:center;padding:0 0 28px;color:#879188;font-size:11px;letter-spacing:.02em}
    @media(max-width:980px){.wrap{width:min(100% - 28px,900px)}.layout{grid-template-columns:1fr}.filters{position:static}.filter-head{cursor:pointer}.cards{grid-template-columns:1fr}.group{padding:15px 18px}.hero{padding-top:38px}}
    @media(max-width:560px){.wrap{width:min(100% - 20px,520px)}.hero{padding:31px 0 23px}.hero h1{font-size:32px}.layout{padding-top:16px;gap:15px}.toolbar{align-items:stretch;flex-direction:column}.result-count{padding-left:3px}.card{padding:16px;min-height:0}.card h2{font-size:18px}.facts{gap:8px}.fact{grid-template-columns:56px 1fr}.filters{border-radius:16px}}
  </style>

  <header class="hero"><div class="wrap"><h1>교내&연합 동아리와 학회를<br>한눈에 확인하세요.</h1></div></header>
  <main class="wrap layout">
    <aside class="filters" aria-label="필터"><div class="filter-head"><h2>분류 필터</h2><button class="reset" id="reset">전체 초기화</button></div>

    </aside>
    <section class="content">
      <div class="toolbar"><label class="search"><input id="search" type="search" placeholder="동아리명·소개 검색" autocomplete="off" aria-label="동아리명·소개 검색"></label><div class="result-count"><strong id="count">0</strong>개 검색됨</div></div>

    </section>

  ];
  function init(payload){
    payload.r.forEach(x=>{if(x[0]==='MEDILUX')x[3]=3;if(x[0]==='책갈피')x[3]=7});
    const rows=[...payload.r.map((x,i)=>({name:x[0],type:TYPE[x[1]],scope:payload.m?.[i]?.p==='교내'?'교내':'연합',cat:payload.c[x[3]],deadline:x[4],regular:REGULAR_NOTES[i]??x[5],description:(payload.d?.[i]??payload.m?.[i]?.s)||'',kind:KIND[x[6]],slots:x[7]?x[7].split(','):[],schedule:payload.m?.[i]?.q||null,url:`https://everytime.kr/418752/v/${x[8]}`})),...ADDITIONAL_RECRUITMENTS.map(x=>({...x,kind:x.regular==='-'?'unknown':'known',slots:[],schedule:null}))];
    const campusOverrides=new Set(['연세생명과학학회','YUSL','연세문학회','공사랑','YDT']);rows.forEach(x=>{if(campusOverrides.has(x.name))x.scope='교내'});
    const deadlineOverrides={'YDT':'8월 8일 23:59','공사랑':'상시 모집'};rows.forEach(x=>{if(deadlineOverrides[x.name])x.deadline=deadlineOverrides[x.name]});
    const yonseiLeaders=rows.find(x=>x.name==='연세리더스클럽(YLC)');if(yonseiLeaders)yonseiLeaders.cat='봉사·교육·인권';
    const bit=rows.find(x=>x.name==='연세대 경영혁신학회 BIT');if(bit)bit.cat='경영·마케팅·창업';
    const sica=rows.find(x=>x.name==='SICA');if(sica)sica.scope='교내';
    const ibiFall=rows.find(x=>x.name==='IBI FALL');if(ibiFall)Object.assign(ibiFall,{cat:'경영·마케팅·창업',deadline:'8월 18일',regular:'산업 리서치 프로젝트·행사 및 워크숍, 학기 초·말 Pitch Day',description:'글로벌 시장을 지향하는 대학생 및 신입 인재를 위한 프로젝트 기반 커리큘럼과 맞춤형 커리어 개발 프로그램을 제공하는 국제경영동아리입니다.',kind:'known'});
    const skyIndex=rows.findIndex(x=>x.name==='SKY');if(skyIndex>=0)rows.splice(skyIndex,1);
    const deadlineAt=value=>{const date=value.match(/(\d+)월\s*(\d+)일/);if(!date)return null;const time=value.match(/(\d{1,2}):(\d{2})/);return new Date(2026,Number(date[1])-1,Number(date[2]),time?Number(time[1]):23,time?Number(time[2]):59)};
    const displayDeadline=value=>String(value).replace(/\s*까지/g,'').trim();
    const now=new Date();
    const selected={type:new Set(TYPE),scope:new Set(SCOPE),cat:new Set(payload.c),days:new Set()};
    const makeChecks=(id,values,key)=>{const el=document.getElementById(id);el.innerHTML=values.map((v,i)=>`<label class="check"><input type="checkbox" value="${esc(v)}" checked><span>${esc(v)}</span></label>`).join('');el.addEventListener('change',e=>{e.target.checked?selected[key].add(e.target.value):selected[key].delete(e.target.value);if(key==='cat')syncTopics();render()})};
    makeChecks('typeChecks',TYPE,'type');makeChecks('scopeChecks',SCOPE,'scope');makeChecks('catChecks',payload.c,'cat');
    const topicToggle=document.getElementById('topicToggle');
    const syncTopics=()=>{const all=selected.cat.size===payload.c.length;topicToggle.textContent=all?'전체 해제':'전체 선택'};
    topicToggle.addEventListener('click',()=>{const selectAll=selected.cat.size!==payload.c.length;selected.cat.clear();if(selectAll)payload.c.forEach(x=>selected.cat.add(x));document.querySelectorAll('#catChecks input').forEach(x=>x.checked=selectAll);syncTopics();render()});
    syncTopics();
    const dayOptions=[['월','1'],['화','2'],['수','3'],['목','4'],['금','5'],['토','6'],['일','0'],['기타','other']],daySelect=document.getElementById('daySelect'),dayToggle=document.getElementById('dayToggle');dayOptions.forEach(([,value])=>selected.days.add(value));daySelect.innerHTML=dayOptions.map(([label,value])=>`<button class="day-slot on" data-day="${value}" aria-pressed="true">${label}</button>`).join('');
    daySelect.addEventListener('click',e=>{const b=e.target.closest('.day-slot');if(!b)return;const d=b.dataset.day;selected.days.has(d)?selected.days.delete(d):selected.days.add(d);syncDays();render()});
    const syncDays=()=>{daySelect.querySelectorAll('.day-slot').forEach(b=>{const on=selected.days.has(b.dataset.day);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});dayToggle.textContent=selected.days.size===dayOptions.length?'전체 해제':'전체 선택'};
    dayToggle.addEventListener('click',()=>{const selectAll=selected.days.size!==dayOptions.length;selected.days.clear();if(selectAll)dayOptions.forEach(([,value])=>selected.days.add(value));syncDays();render()});
    const search=document.getElementById('search'),excludeClosed=document.getElementById('excludeClosed');search.addEventListener('input',render);excludeClosed.addEventListener('change',render);
    document.getElementById('reset').onclick=()=>{document.querySelectorAll('.filters input[type=checkbox]').forEach(x=>x.checked=true);TYPE.forEach(x=>selected.type.add(x));SCOPE.forEach(x=>selected.scope.add(x));payload.c.forEach(x=>selected.cat.add(x));dayOptions.forEach(([,value])=>selected.days.add(value));search.value='';syncDays();syncTopics();render()};
    const cards=document.getElementById('cards'), empty=document.getElementById('empty');
    const DAY_MAP={일:'0',월:'1',화:'2',수:'3',목:'4',금:'5',토:'6'}, DAY_ORDER=['일','월','화','수','목','금','토'];
    const addDayToken=(text,days)=>{for(const m of text.matchAll(/([월화수목금토일])(?:요일)?(?!\s*\d+\s*회)/g))days.add(DAY_MAP[m[1]])};
    function expandDayRange(start,end){const s=DAY_ORDER.indexOf(start),e=DAY_ORDER.indexOf(end);if(s<0||e<0)return[];const result=[];let i=s;while(true){result.push(String(i));if(i===e)break;i=(i+1)%7}return result}
    function extractActivityDays(regular){const text=String(regular??'').replace(/\s+/g,' ').trim(),days=new Set();for(const m of text.matchAll(/([월화수목금토일])요일/g))days.add(DAY_MAP[m[1]]);for(const m of text.matchAll(/[\(\[]\s*([월화수목금토일])(?:요일)?\s*[\)\]]/g))days.add(DAY_MAP[m[1]]);for(const m of text.matchAll(/([월화수목금토일])\s*[~～\-–]\s*([월화수목금토일])/g))for(const d of expandDayRange(m[1],m[2]))days.add(d);const contextualPattern=/(?:매주|매 주|정규\s*(?:모임|세션)|정기\s*(?:모임|세션)|활동\s*요일|모임\s*요일)\s*[:：]?\s*([월화수목금토일](?:요일)?(?:\s*(?:·|\/|,|ㆍ|&|와|과)\s*[월화수목금토일](?:요일)?)*)/g;for(const m of text.matchAll(contextualPattern))addDayToken(m[1],days);for(const m of text.matchAll(/([월화수목금토일](?:요일)?(?:\s*(?:·|\/|,|ㆍ|&|와|과)\s*[월화수목금토일](?:요일)?)+)/g))addDayToken(m[1],days);return[...days]}
    const conciseActivity=x=>{if(x.kind!=='known')return x.regular==='-'?'-':'알 수 없음';return x.regular.replace(/^[\s·•\-]+/,'').replace(/\s+/g,' ').trim().slice(0,100)};
    function render(){const q=search.value.trim().toLocaleLowerCase('ko');const shown=rows.filter(x=>{const deadline=deadlineAt(x.deadline);const searchText=[x.name,x.description].filter(Boolean).join(' ').toLocaleLowerCase('ko');if(q&&!searchText.includes(q))return false;if(excludeClosed.checked&&deadline&&deadline<now)return false;if(!selected.type.has(x.type)||!selected.scope.has(x.scope)||!selected.cat.has(x.cat))return false;const activityDays=extractActivityDays(x.regular);const classifiedDays=activityDays.length?activityDays:['other'];return classifiedDays.every(d=>selected.days.has(d))}).sort((a,b)=>{const aDeadline=deadlineAt(a.deadline),bDeadline=deadlineAt(b.deadline);if(aDeadline&&bDeadline){const difference=aDeadline-bDeadline;if(difference)return difference}else if(aDeadline)return-1;else if(bDeadline)return 1;return a.name.localeCompare(b.name,'ko')});
      cards.innerHTML=shown.map(x=>`<article class="card"><div class="chips"><span class="chip type">${esc(x.type)}</span><span class="chip scope">${esc(x.scope)}</span><span class="chip">${esc(x.cat)}</span></div><div class="card-title"><h2>${esc(x.name)}</h2><a class="title-source" href="${x.url}" target="_blank" rel="noopener">원문 보기 ↗</a></div><dl class="facts"><div class="fact"><dt>모집 마감</dt><dd class="deadline">${esc(displayDeadline(x.deadline))}</dd></div><div class="fact"><dt>정규 모임</dt><dd>${esc(conciseActivity(x))}</dd></div><div class="fact"><dt>소개</dt><dd>${esc(x.description)}</dd></div></dl></article>`).join('');document.getElementById('count').textContent=shown.length;empty.style.display=shown.length?'none':'block'}
    render();
  }
