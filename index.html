  function init(payload){
    const rows=[...payload.r.map((x,i)=>({name:x[0],type:TYPE[x[1]],scope:payload.m?.[i]?.p==='교내'?'교내':'연합',cat:payload.c[x[3]],deadline:x[4],regular:REGULAR_NOTES[i]??x[5],description:(payload.d?.[i]??payload.m?.[i]?.s)||'',certified:CERTIFIED_NAMES.has(x[0]),kind:KIND[x[6]],slots:x[7]?x[7].split(','):[],schedule:payload.m?.[i]?.q||null,url:`https://everytime.kr/418752/v/${x[8]}`})),...ADDITIONAL_RECRUITMENTS.map(x=>({...x,certified:CERTIFIED_NAMES.has(x.name),kind:x.regular==='-'?'unknown':'known',slots:[],schedule:null}))];
    const deadlineAt=value=>{const date=value.match(/(\d+)월\s*(\d+)일/);if(!date)return null;const time=value.match(/(\d{1,2}):(\d{2})/);return new Date(2026,Number(date[1])-1,Number(date[2]),time?Number(time[1]):23,time?Number(time[2]):59)};

    const makeChecks=(id,values,key)=>{const el=document.getElementById(id);el.innerHTML=values.map((v,i)=>`<label class="check"><input type="checkbox" value="${esc(v)}" checked><span>${esc(v)}</span></label>`).join('');el.addEventListener('change',e=>{e.target.checked?selected[key].add(e.target.value):selected[key].delete(e.target.value);if(key==='cat')syncTopics();render()})};
    makeChecks('typeChecks',TYPE,'type');makeChecks('scopeChecks',SCOPE,'scope');makeChecks('catChecks',payload.c,'cat');
    const topicToggle=document.getElementById('topicToggle');
    const syncTopics=()=>{const all=selected.cat.size===payload.c.length;topicToggle.textContent=all?'전체 해제':'전체 선택'};
    topicToggle.addEventListener('click',()=>{const selectAll=selected.cat.size!==payload.c.length;selected.cat.clear();if(selectAll)payload.c.forEach(x=>selected.cat.add(x));document.querySelectorAll('#catChecks input').forEach(x=>x.checked=selectAll);syncTopics();render()});
    syncTopics();
    const dayOptions=[['월','1'],['화','2'],['수','3'],['목','4'],['금','5'],['토','6'],['일','0'],['기타','other']],daySelect=document.getElementById('daySelect'),dayToggle=document.getElementById('dayToggle');dayOptions.forEach(([,value])=>selected.days.add(value));daySelect.innerHTML=dayOptions.map(([label,value])=>`<button class="day-slot on" data-day="${value}" aria-pressed="true">${label}</button>`).join('');
    daySelect.addEventListener('click',e=>{const b=e.target.closest('.day-slot');if(!b)return;const d=b.dataset.day;selected.days.has(d)?selected.days.delete(d):selected.days.add(d);syncDays();render()});
    const syncDays=()=>{daySelect.querySelectorAll('.day-slot').forEach(b=>{const on=selected.days.has(b.dataset.day);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});dayToggle.textContent=selected.days.size===dayOptions.length?'전체 해제':'전체 선택'};
    dayToggle.addEventListener('click',()=>{const selectAll=selected.days.size!==dayOptions.length;selected.days.clear();if(selectAll)dayOptions.forEach(([,value])=>selected.days.add(value));syncDays();render()});
    const search=document.getElementById('search'),excludeClosed=document.getElementById('excludeClosed'),certifiedOnly=document.getElementById('certifiedOnly');search.addEventListener('input',render);excludeClosed.addEventListener('change',render);certifiedOnly.addEventListener('change',render);
    document.getElementById('reset').onclick=()=>{document.querySelectorAll('.filters input[type=checkbox]').forEach(x=>x.checked=x.id!=='certifiedOnly');TYPE.forEach(x=>selected.type.add(x));SCOPE.forEach(x=>selected.scope.add(x));payload.c.forEach(x=>selected.cat.add(x));dayOptions.forEach(([,value])=>selected.days.add(value));search.value='';syncDays();syncTopics();render()};
    const cards=document.getElementById('cards'), empty=document.getElementById('empty'), showClosed=document.getElementById('showClosed');
    showClosed.addEventListener('click',()=>{excludeClosed.checked=false;render()});
    const fitCards=()=>{cards.style.removeProperty('--record-card-height');const records=[...cards.querySelectorAll('.card')];if(!records.length)return;const cardHeight=Math.max(...records.map(card=>Math.ceil(card.getBoundingClientRect().height)));cards.style.setProperty('--record-card-height',`${cardHeight}px`)};
    window.addEventListener('resize',fitCards);
    const heroTitle=document.querySelector('.hero h1');
    const fitHeroTitle=()=>{heroTitle.style.removeProperty('font-size');const available=heroTitle.parentElement.getBoundingClientRect().width;const natural=heroTitle.scrollWidth;if(natural>available){const base=parseFloat(getComputedStyle(heroTitle).fontSize);heroTitle.style.fontSize=`${Math.max(14,base*available/natural)}px`}};
    window.addEventListener('resize',fitHeroTitle);

    const DAY_MAP={일:'0',월:'1',화:'2',수:'3',목:'4',금:'5',토:'6'}, DAY_ORDER=['일','월','화','수','목','금','토'];
    const addDayToken=(text,days)=>{for(const m of text.matchAll(/([월화수목금토일])(?:요일)?(?!\s*\d+\s*회)/g))days.add(DAY_MAP[m[1]])};
    function expandDayRange(start,end){const s=DAY_ORDER.indexOf(start),e=DAY_ORDER.indexOf(end);if(s<0||e<0)return[];const result=[];let i=s;while(true){result.push(String(i));if(i===e)break;i=(i+1)%7}return result}
    function extractActivityDays(regular){const text=String(regular??'').replace(/\s+/g,' ').trim(),days=new Set();for(const m of text.matchAll(/([월화수목금토일])요일/g))days.add(DAY_MAP[m[1]]);for(const m of text.matchAll(/[\(\[]\s*([월화수목금토일])(?:요일)?\s*[\)\]]/g))days.add(DAY_MAP[m[1]]);for(const m of text.matchAll(/([월화수목금토일])\s*[~～\-–]\s*([월화수목금토일])/g))for(const d of expandDayRange(m[1],m[2]))days.add(d);const contextualPattern=/(?:매주|매 주|정규\s*(?:모임|세션)|정기\s*(?:모임|세션)|활동\s*요일|모임\s*요일)\s*[:：]?\s*([월화수목금토일](?:요일)?(?:\s*(?:·|\/|,|ㆍ|&|와|과)\s*[월화수목금토일](?:요일)?)*)/g;for(const m of text.matchAll(contextualPattern))addDayToken(m[1],days);for(const m of text.matchAll(/([월화수목금토일](?:요일)?(?:\s*(?:·|\/|,|ㆍ|&|와|과)\s*[월화수목금토일](?:요일)?)+)/g))addDayToken(m[1],days);return[...days]}
    const conciseActivity=x=>{if(x.kind!=='known')return x.regular==='-'?'-':'알 수 없음';return x.regular.replace(/^[\s·•\-]+/,'').replace(/\s+/g,' ').trim().slice(0,100)};
    function render(){const q=search.value.trim().toLocaleLowerCase('ko');const matches=rows.filter(x=>{const searchText=[x.name,x.description].filter(Boolean).join(' ').toLocaleLowerCase('ko');if(q&&!searchText.includes(q))return false;if(certifiedOnly.checked&&!x.certified)return false;if(!selected.type.has(x.type)||!selected.scope.has(x.scope)||!selected.cat.has(x.cat))return false;const activityDays=extractActivityDays(x.regular);const classifiedDays=activityDays.length?activityDays:['other'];return classifiedDays.every(d=>selected.days.has(d))});const shown=matches.filter(x=>{const deadline=deadlineAt(x.deadline);return !excludeClosed.checked||!deadline||deadline>=now}).sort((a,b)=>{const aDeadline=deadlineAt(a.deadline),bDeadline=deadlineAt(b.deadline);if(aDeadline&&bDeadline){const difference=aDeadline-bDeadline;if(difference)return difference}else if(aDeadline)return-1;else if(bDeadline)return 1;return a.name.localeCompare(b.name,'ko')});
      cards.innerHTML=shown.map(x=>{return `<article class="card decor-${1+Math.floor(Math.random()*4)}${x.certified?' is-certified':''}">${x.certified?'<div class="certified-mark" aria-hidden="true"></div>':''}<div class="card-body"><div class="card-title"><h2 title="${esc(x.name)}">${esc(x.name)}</h2><a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div><div class="chips"><span class="chip scope">#${esc(x.scope)}</span><span class="chip type">#${esc(x.type)}</span><span class="chip">#${esc(x.cat)}</span>${x.certified?'<span class="chip certified-chip">#건전성인증<span class="certified-chip-check" aria-hidden="true"></span></span>':''}</div><p class="card-description">${esc(x.description||'소개가 없습니다.')}</p><dl class="facts"><div class="fact"><dt>모집 마감</dt><dd class="deadline">${esc(displayDeadline(x.deadline))}</dd></div><div class="fact"><dt>정규 모임</dt><dd>${esc(conciseActivity(x))}</dd></div></dl></div></article>`}).join('');document.getElementById('count').textContent=shown.length;empty.style.display=shown.length?'none':'block';const hasClosed=matches.some(x=>{const deadline=deadlineAt(x.deadline);return deadline&&deadline<now});showClosed.style.display=!shown.length&&excludeClosed.checked&&hasClosed?'flex':'none';fitCards()}
    render();
  }
